[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "petbot"
version = "0.1.0"
description = "Cerebro software de PETBOT"
readme = "README.md"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
vision = ["opencv-python>=4.10,<5"]
mobile = ["qrcode[pil]>=8.0"]
neural-voice = ["piper-tts>=1.7,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"petbot.infrastructure.voice" = ["*.swift"]
